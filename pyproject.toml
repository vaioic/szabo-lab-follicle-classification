[project]
name = "szabo-lab-follicle-classification"
version = "0.1.0"
description = "Template for analysis projects using uv"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

dependencies = [
    "numpy",
    "scikit-image",
    "matplotlib",
    "tifffile",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "pandas>=3.0.6",
    "tensorboard>=2.21.0",
    "openslide-bin>=4.0.1.2",
    "openslide-python>=1.4.6",
    "scikit-learn>=1.9.1",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shared"
module-root = ""
